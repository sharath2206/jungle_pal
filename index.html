<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10B981" />
    <meta name="description" content="Jungle Pals - Early Learning Adventure App for Kids" />
    <title>Jungle Pals - Kids Early Learning App</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts: Rubik & Nunito Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,600&family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
      /* Reset and cross-platform native feel */
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #FFF8F6;
        font-family: 'Rubik', 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      /* Global touch-action and momentum scrolling rules for React Native Web ScrollViews */
      .r-overflowY-auto, div[style*="overflow-y: auto"], div[style*="overflow-y: scroll"] {
        touch-action: pan-y !important;
        -webkit-overflow-scrolling: touch !important;
        overscroll-behavior-y: contain;
      }

      .r-overflowX-auto, div[style*="overflow-x: auto"], div[style*="overflow-x: scroll"] {
        touch-action: pan-x !important;
        -webkit-overflow-scrolling: touch !important;
        overscroll-behavior-x: contain;
      }

      * {
        box-sizing: border-box;
      }

      /* Hide scrollbars while allowing smooth touch scroll */
      ::-webkit-scrollbar {
        width: 0px;
        height: 0px;
        display: none;
      }

      /* Animated sparkle & bounce keyframes */
      @keyframes softBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      @keyframes pulseSlow {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }

      .soft-bounce {
        animation: softBounce 2s ease-in-out infinite;
      }

      .pulse-slow {
        animation: pulseSlow 2.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
