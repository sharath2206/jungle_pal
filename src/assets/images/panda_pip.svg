<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2E9FB" />
      <stop offset="40%" stop-color="#E0F7FA" />
      <stop offset="70%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bambooGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="40%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="bambooGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="50%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pandaBodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>
    <radialGradient id="pandaDarkGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sky & Meadow Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <circle cx="160" cy="90" r="150" fill="url(#sunGlow)" />

  <!-- Background Bamboo Stems -->
  <g opacity="0.6">
    <rect x="60" y="0" width="18" height="480" rx="9" fill="url(#bambooGrad1)" />
    <line x1="60" y1="120" x2="78" y2="120" stroke="#064E3B" stroke-width="3" />
    <line x1="60" y1="240" x2="78" y2="240" stroke="#064E3B" stroke-width="3" />
    <line x1="60" y1="360" x2="78" y2="360" stroke="#064E3B" stroke-width="3" />

    <rect x="710" y="0" width="22" height="480" rx="11" fill="url(#bambooGrad2)" />
    <line x1="710" y1="100" x2="732" y2="100" stroke="#064E3B" stroke-width="4" />
    <line x1="710" y1="230" x2="732" y2="230" stroke="#064E3B" stroke-width="4" />
    <line x1="710" y1="350" x2="732" y2="350" stroke="#064E3B" stroke-width="4" />

    <rect x="750" y="0" width="14" height="480" rx="7" fill="url(#bambooGrad1)" opacity="0.8" />
  </g>

  <!-- Foreground Bamboo Stalks -->
  <rect x="120" y="0" width="26" height="480" rx="13" fill="url(#bambooGrad2)" filter="url(#softShadow)" />
  <line x1="120" y1="140" x2="146" y2="140" stroke="#064E3B" stroke-width="4" />
  <line x1="120" y1="280" x2="146" y2="280" stroke="#064E3B" stroke-width="4" />
  <!-- Bamboo Leaves -->
  <path d="M 146 140 C 190 125 230 145 250 160 C 220 175 170 170 146 140 Z" fill="#22C55E" opacity="0.9" />
  <path d="M 146 140 C 180 100 210 95 240 105 C 205 125 175 135 146 140 Z" fill="#16A34A" />
  <path d="M 120 280 C 70 260 40 280 15 300 C 50 310 90 300 120 280 Z" fill="#22C55E" />

  <!-- Ground Hills -->
  <ellipse cx="400" cy="490" rx="450" ry="120" fill="#10B981" />
  <ellipse cx="250" cy="480" rx="300" ry="90" fill="#059669" opacity="0.6" />

  <!-- Little Wild Flowers -->
  <g fill="#FDE047">
    <circle cx="210" cy="430" r="7" /><circle cx="240" cy="445" r="5" />
    <circle cx="580" cy="425" r="7" /><circle cx="620" cy="440" r="6" />
    <circle cx="560" cy="450" r="5" /><circle cx="180" cy="445" r="6" />
  </g>

  <!-- PANDA CHARACTER -->
  <g filter="url(#softShadow)" transform="translate(400, 260)">
    <!-- Shadow under panda -->
    <ellipse cx="0" cy="155" rx="130" ry="25" fill="#064E3B" opacity="0.4" />

    <!-- Panda Legs -->
    <ellipse cx="-80" cy="120" rx="42" ry="32" fill="url(#pandaDarkGrad)" />
    <circle cx="-95" cy="125" r="9" fill="#475569" />
    <circle cx="-80" cy="115" r="6" fill="#475569" />
    <circle cx="-68" cy="120" r="6" fill="#475569" />

    <ellipse cx="80" cy="120" rx="42" ry="32" fill="url(#pandaDarkGrad)" />
    <circle cx="95" cy="125" r="9" fill="#475569" />
    <circle cx="80" cy="115" r="6" fill="#475569" />
    <circle cx="68" cy="120" r="6" fill="#475569" />

    <!-- Panda Body -->
    <ellipse cx="0" cy="70" rx="95" ry="85" fill="url(#pandaBodyGrad)" />
    <!-- Dark chest band -->
    <path d="M -85 30 Q 0 95 85 30 Q 75 10 -75 10 Z" fill="url(#pandaDarkGrad)" opacity="0.95" />

    <!-- Panda Arms -->
    <ellipse cx="-75" cy="55" rx="30" ry="46" transform="rotate(25 -75 55)" fill="url(#pandaDarkGrad)" />
    <ellipse cx="75" cy="55" rx="30" ry="46" transform="rotate(-25 75 55)" fill="url(#pandaDarkGrad)" />

    <!-- Bamboo in Hands -->
    <rect x="-18" y="-30" width="16" height="150" rx="8" transform="rotate(-18 -10 40)" fill="url(#bambooGrad1)" />
    <path d="M -25 20 C -50 0 -70 5 -90 10 C -70 25 -45 30 -25 20 Z" fill="#4ADE80" />
    <path d="M 0 5 C 20 -15 45 -10 65 -5 C 45 10 20 15 0 5 Z" fill="#22C55E" />

    <!-- Panda Ears -->
    <ellipse cx="-72" cy="-90" rx="32" ry="28" fill="url(#pandaDarkGrad)" />
    <ellipse cx="-72" cy="-90" rx="18" ry="14" fill="#475569" opacity="0.6" />
    <ellipse cx="72" cy="-90" rx="32" ry="28" fill="url(#pandaDarkGrad)" />
    <ellipse cx="72" cy="-90" rx="18" ry="14" fill="#475569" opacity="0.6" />

    <!-- Panda Head -->
    <circle cx="0" cy="-35" r="88" fill="url(#pandaBodyGrad)" />

    <!-- Eye Patches -->
    <ellipse cx="-38" cy="-35" rx="26" ry="22" transform="rotate(-15 -38 -35)" fill="url(#pandaDarkGrad)" />
    <ellipse cx="38" cy="-35" rx="26" ry="22" transform="rotate(15 38 -35)" fill="url(#pandaDarkGrad)" />

    <!-- Eyes (Big Sparkling) -->
    <ellipse cx="-36" cy="-34" rx="13" ry="15" fill="#0F172A" />
    <circle cx="-32" cy="-40" r="5" fill="#FFFFFF" />
    <circle cx="-39" cy="-30" r="2.5" fill="#FFFFFF" />

    <ellipse cx="36" cy="-34" rx="13" ry="15" fill="#0F172A" />
    <circle cx="40" cy="-40" r="5" fill="#FFFFFF" />
    <circle cx="33" cy="-30" r="2.5" fill="#FFFFFF" />

    <!-- Rosy Cheeks -->
    <circle cx="-52" cy="-10" r="14" fill="#FDA4AF" opacity="0.5" />
    <circle cx="52" cy="-10" r="14" fill="#FDA4AF" opacity="0.5" />

    <!-- Cute Panda Nose -->
    <ellipse cx="0" cy="-14" rx="14" ry="10" fill="url(#pandaDarkGrad)" />
    <ellipse cx="0" cy="-16" rx="6" ry="3" fill="#64748B" />

    <!-- Happy Panda Smile -->
    <path d="M 0 -4 L 0 4 M -12 2 C -6 12 0 12 0 4 C 0 12 6 12 12 2" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Pink Tongue -->
    <path d="M -4 6 C -4 14 4 14 4 6 Z" fill="#F43F5E" />
  </g>
</svg>
